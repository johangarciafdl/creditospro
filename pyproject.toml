[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditospro"
version = "2.1.0"
description = "Sistema de gestion de creditos y cobros multi-tenant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Johan Garcia" }
]
keywords = ["creditos", "cobranza", "fintech", "multi-tenant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0,<0.40.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "Pillow>=10.4.0,<12.0.0",
    "openpyxl>=3.1.4,<4.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "cryptography>=42.0.0,<46.0.0",
    "requests>=2.32.0,<3.0.0",
    "httpx>=0.27.0,<0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.6.0,<2.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (manejado por formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "S101",  # use of assert detected (pytest)
    "S105",  # hardcoded password string
    "S110",  # try-except-pass (a veces intencional)
    "S301",  # pickle (no usamos pickle)
    "UP038", # isinstance con tupla (estilo)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S", "T201"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:passlib.*",
]
