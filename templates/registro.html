<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreditosPro — Registrar Empresa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--v8:#0f3d28;--v6:#1a6b4a;--v5:#2d9e6e;--v4:#52c49a;--rd:#c0392b;--font:'DM Sans',system-ui,sans-serif;--r:10px}
body{font-family:var(--font);background:linear-gradient(135deg,var(--v8),#1a5276);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:480px}
.brand{text-align:center;margin-bottom:24px}
.brand-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--v5),var(--v4));display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 10px;box-shadow:0 8px 20px rgba(45,158,110,.4)}
.brand-name{color:#fff;font-size:22px;font-weight:600}
.brand-sub{color:rgba(255,255,255,.5);font-size:12px;margin-top:3px}
.card{background:#fff;border-radius:var(--r);padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.card-title{font-size:16px;font-weight:600;color:#111;margin-bottom:4px}
.card-sub{font-size:12px;color:#6b7280;margin-bottom:20px}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--v6);margin:16px 0 10px;padding-bottom:4px;border-bottom:1px solid #e5e7eb}
.fg{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:4px}
input,select{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--v5);box-shadow:0 0 0 3px rgba(45,158,110,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:11px;background:var(--v6);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;margin-top:6px;transition:background .15s}
.btn:hover{background:var(--v8)}
.alert{background:#fef2f2;border:1px solid #fecaca;border-radius:7px;padding:9px 12px;font-size:12px;color:var(--rd);margin-bottom:14px}
.login-link{text-align:center;margin-top:14px;font-size:12px;color:#6b7280}
.login-link a{color:var(--v6);font-weight:500;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">💳</div>
    <div class="brand-name">CreditosPro</div>
    <div class="brand-sub">Crea la cuenta de tu empresa</div>
  </div>
  <div class="card">
    <div class="card-title">Registrar empresa</div>
    <div class="card-sub">Configura tu sistema de créditos independiente</div>

    {% if error %}<div class="alert">⚠ {{ error }}</div>{% endif %}

    <form method="post" action="/registro">
      <div class="section-label">Datos de la empresa</div>
      <div class="fg"><label>Nombre de la empresa *</label><input name="empresa_nombre" required placeholder="ej: Inversiones Rápidas SAS"></div>
      <div class="grid2">
        <div class="fg"><label>NIT / RUT</label><input name="empresa_nit" placeholder="900123456-1"></div>
        <div class="fg"><label>País</label>
          <select name="pais">
            <option value="Colombia">🇨🇴 Colombia</option>
            <option value="México">🇲🇽 México</option>
            <option value="Venezuela">🇻🇪 Venezuela</option>
            <option value="Ecuador">🇪🇨 Ecuador</option>
            <option value="Perú">🇵🇪 Perú</option>
            <option value="Chile">🇨🇱 Chile</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="section-label">Cuenta del administrador</div>
      <div class="fg"><label>Nombre completo *</label><input name="admin_nombre" required placeholder="Tu nombre"></div>
      <div class="fg"><label>Username *</label><input name="admin_username" required placeholder="ej: admin_miempresa" autocomplete="username"></div>
      <div class="grid2">
        <div class="fg"><label>Contraseña *</label><input type="password" name="admin_password" required minlength="6" placeholder="Mín. 6 caracteres"></div>
        <div class="fg"><label>Confirmar *</label><input type="password" name="admin_password2" required placeholder="Repetir"></div>
      </div>

      <button type="submit" class="btn">Crear mi empresa →</button>
    </form>
    <div class="login-link">¿Ya tienes cuenta? <a href="/auth/login">Iniciar sesión</a></div>
  </div>
</div>
</body>
</html>
