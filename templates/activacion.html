<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CreditosPro - Activacion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#0A0A0A;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,480px);opacity:0;transform:translateY(20px)}.logo{width:58px;height:58px;margin:0 auto 20px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#C8A95A,#7A5A18);box-shadow:0 0 42px rgba(200,169,90,.3);color:#0A0A0A}.logo svg{width:30px}h1{text-align:center;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:rgba(255,255,255,.42);font-size:13px;line-height:1.6;margin-bottom:24px}.box{padding:25px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px}.label{display:block;color:rgba(255,255,255,.5);font-size:12px;margin-bottom:7px}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font:inherit;outline:none}input:focus{border-color:rgba(200,169,90,.6);box-shadow:0 0 0 3px rgba(200,169,90,.1)}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:9px;background:linear-gradient(135deg,#C8A95A,#9A7428);color:#0A0A0A;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.error,.success{display:none;margin-top:13px;padding:10px 12px;border-radius:8px;font-size:12px}.error{color:#FCA5A5;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25)}.success{color:#86EFAC;background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25)}.hint{text-align:center;color:rgba(255,255,255,.25);font-size:11px;margin-top:18px}
</style>
</head>
<body><main class="wrap" id="wrap"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M9 9h4.5a1.5 1.5 0 0 1 0 3H10a1.5 1.5 0 0 0 0 3H15"/></svg></div><h1>Activacion de empresa</h1><p class="sub">Ingresa la clave unica proporcionada por el administrador de tu empresa. La misma clave puede utilizarse en sus dispositivos autorizados.</p><section class="box"><label class="label" for="activation-key">Clave de activacion</label><input id="activation-key" type="password" autocomplete="off" maxlength="120" placeholder="ELRUSSO-..." autofocus><button id="activate-button" type="button">Validar y continuar</button><div class="error" id="error-box"></div><div class="success" id="success-box"></div></section><div class="hint">La clave nunca se almacena en el navegador ni se muestra completa.</div></main><script>
anime({targets:'#wrap',translateY:[20,0],opacity:[0,1],duration:650,easing:'easeOutQuart'});
const key=document.getElementById('activation-key'),button=document.getElementById('activate-button'),error=document.getElementById('error-box'),success=document.getElementById('success-box');
let timer=null;
function showError(text){error.textContent=text;error.style.display='block';success.style.display='none';}
function showSuccess(text){success.textContent=text;success.style.display='block';error.style.display='none';}
function lock(seconds){button.disabled=true;let left=seconds;button.textContent=`Espera ${left}s`;timer&&clearInterval(timer);timer=setInterval(()=>{left-=1;if(left<=0){clearInterval(timer);button.disabled=false;button.textContent='Validar y continuar';}else button.textContent=`Espera ${left}s`;},1000);}
async function activate(){const value=key.value.trim();if(!value){showError('Ingresa la clave de activacion.');return;}button.disabled=true;button.textContent='Validando...';try{const fd=new FormData();fd.append('license_key',value);const response=await fetch('/license/activate',{method:'POST',body:fd});const data=await response.json();if(data.valid){showSuccess(`Empresa validada: ${data.empresa_nombre}.`);setTimeout(()=>location.href=data.redirect||'/auth/login',600);return;}showError(data.error||'Clave de activacion invalida.');lock(Number(data.retry_after)||30);}catch(exc){showError('No se pudo validar la clave. Intenta nuevamente.');button.disabled=false;button.textContent='Validar y continuar';}}
button.addEventListener('click',activate);key.addEventListener('keydown',event=>{if(event.key==='Enter')activate();});
</script></body></html>
