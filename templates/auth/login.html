<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreditosPro — Iniciar Sesión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde-800:#0f3d28;--verde-600:#1a6b4a;--verde-500:#2d9e6e;--verde-400:#52c49a;
  --rojo:#c0392b;--bg:#f4f6f9;--card:#fff;
  --border:#e5e7eb;--text-1:#111827;--text-2:#6b7280;
  --radius:12px;--font:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--font);background:linear-gradient(135deg,var(--verde-800) 0%,#1a5276 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

.login-wrap{width:100%;max-width:400px;}

.brand{text-align:center;margin-bottom:28px;}
.brand-icon{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,var(--verde-500),var(--verde-400));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 12px;box-shadow:0 8px 20px rgba(45,158,110,0.4);
}
.brand-name{color:#fff;font-size:24px;font-weight:600;letter-spacing:-0.5px;}
.brand-sub{color:rgba(255,255,255,0.5);font-size:13px;margin-top:4px;}

.card{
  background:#fff;border-radius:var(--radius);padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

.card-title{font-size:18px;font-weight:600;color:var(--text-1);margin-bottom:6px;}
.card-sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}

.form-group{margin-bottom:16px;}
label{display:block;font-size:13px;font-weight:500;color:var(--text-1);margin-bottom:6px;}
input{
  width:100%;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-size:14px;font-family:var(--font);
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
  background:#fafafa;color:var(--text-1);
}
input:focus{border-color:var(--verde-500);box-shadow:0 0 0 3px rgba(45,158,110,0.1);background:#fff;}

.btn-login{
  width:100%;padding:12px;background:var(--verde-600);color:#fff;
  border:none;border-radius:8px;font-size:15px;font-weight:600;
  font-family:var(--font);cursor:pointer;transition:background 0.2s;margin-top:8px;
}
.btn-login:hover{background:var(--verde-800);}
.btn-login:active{transform:scale(0.99);}

.alert-error{
  background:#fef2f2;border:1px solid #fecaca;border-radius:8px;
  padding:10px 14px;font-size:13px;color:var(--rojo);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}

.demo-hint{
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;
  padding:10px 14px;font-size:12px;color:#166534;margin-top:16px;
  line-height:1.6;
}
.demo-hint strong{display:block;font-size:11px;text-transform:uppercase;
  letter-spacing:0.5px;color:#15803d;margin-bottom:4px;}

.version{text-align:center;color:rgba(255,255,255,0.25);font-size:11px;margin-top:20px;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">💳</div>
    <div class="brand-name">CreditosPro</div>
    <div class="brand-sub">Sistema de Gestión de Créditos v2.0</div>
  </div>

  <div class="card">
    <div class="card-title">Iniciar sesión</div>
    <div class="card-sub">Ingresa tus credenciales para continuar</div>

    {% if error %}
    <div class="alert-error">⚠ {{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="ej: admin"
               autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">Entrar →</button>
    </form>

    <div style="text-align:center;margin-bottom:12px;font-size:12px;color:#6b7280">¿Empresa nueva? <a href="/registro" style="color:#1a6b4a;font-weight:500">Crear cuenta gratis →</a></div>
    <div class="demo-hint">
      <strong>🔑 Credenciales demo</strong>
      Admin: <strong>admin</strong> / <strong>admin123</strong><br>
      Cobrador: <strong>cobrador1</strong> / <strong>cobrador123</strong>
    </div>
  </div>
  <div class="version">CreditosPro v2.0 © 2025</div>
</div>
</body>
</html>
