name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: |
          ruff check app/ tests/ --output-format=github

      - name: Compile-check all .py
        run: |
          python -c "
          import pathlib, ast
          files = [p for p in pathlib.Path('app').rglob('*.py')]
          errs = 0
          for p in files:
              try:
                  ast.parse(p.read_text(encoding='utf-8', errors='ignore'), filename=str(p))
              except SyntaxError as e:
                  errs += 1
                  print(f'SYNTAX {p}:{e.lineno}: {e.msg}')
          print(f'Compiled: {len(files)-errs}/{len(files)} files OK')
          exit(errs)
          "

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test-secret-key-for-ci-only
          SESSION_SECRET_KEY: test-session-secret-key-for-ci-only
          ENVIRONMENT: development
          AUTO_CREATE_TABLES: "0"
        run: |
          python -m pytest tests/ -v --tb=short --color=yes
